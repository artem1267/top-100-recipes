<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Смачний Світ - Топ 100 Рецептів</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-orange-50 text-stone-800">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const Search = ({ className }) => (<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>);
    const X = ({ className }) => (<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>);
    const ChefHat = ({ className, size=24 }) => (<svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M17 21v-4a2 2 0 0 1 2-2h1a2 2 0 0 0 2-2v-2a2 2 0 0 0-2-2h-1a2 2 0 0 1-2-2V8a5 5 0 0 0-10 0v1a2 2 0 0 1-2 2H4a2 2 0 0 0-2 2v2a2 2 0 0 0 2 2h1a2 2 0 0 1 2 2v4"/><path d="M17 21h-10"/></svg>);
    const Utensils = ({ className }) => (<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/><path d="M21 15V2v0a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/></svg>);
    const Clock = ({ className }) => (<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>);
    const Flame = ({ className }) => (<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg>);

    const dishesList = [
      { name: "Борщ", emoji: "🍲" }, { name: "Вареники", emoji: "🥟" }, { name: "Голубці", emoji: "🥬" },
      { name: "Деруни", emoji: "🥔" }, { name: "Сало з часником", emoji: "🥓" }, { name: "Сирники", emoji: "🥞" },
      { name: "Котлета по-київськи", emoji: "🍗" }, { name: "Млинці", emoji: "🥞" }, { name: "Капусняк", emoji: "🍲" },
      { name: "Холодець", emoji: "🥩" }, { name: "Піца Маргарита", emoji: "🍕" }, { name: "Спагеті Карбонара", emoji: "🍝" },
      { name: "Лазанья", emoji: "🥘" }, { name: "Різотто", emoji: "🍚" }, { name: "Тірамісу", emoji: "🍰" },
      { name: "Равіолі", emoji: "🥟" }, { name: "Паста Болоньєзе", emoji: "🍝" }, { name: "Суші", emoji: "🍣" },
      { name: "Роли Каліфорнія", emoji: "🍱" }, { name: "Роли Філадельфія", emoji: "🍱" }, { name: "Рамен", emoji: "🍜" },
      { name: "Удон", emoji: "🍜" }, { name: "Том Ям", emoji: "🍲" }, { name: "Пад Тай", emoji: "🍝" },
      { name: "Пекінська качка", emoji: "🦆" }, { name: "Фо Бо", emoji: "🍜" }, { name: "Хачапурі", emoji: "🧀" },
      { name: "Хінкалі", emoji: "🥟" }, { name: "Шашлик", emoji: "🍢" }, { name: "Плов", emoji: "🍛" },
      { name: "Кебаб", emoji: "🌯" }, { name: "Шаурма", emoji: "🥙" }, { name: "Фалафель", emoji: "🧆" },
      { name: "Хумус", emoji: "🥣" }, { name: "Бургер", emoji: "🍔" }, { name: "Чизбургер", emoji: "🍔" },
      { name: "Хот-дог", emoji: "🌭" }, { name: "Стейк Рібай", emoji: "🥩" }, { name: "Картопля фрі", emoji: "🍟" },
      { name: "Курячі нагетси", emoji: "🍗" }, { name: "Крильця Баффало", emoji: "🍗" }, { name: "Панкейки", emoji: "🥞" },
      { name: "Брауні", emoji: "🍫" }, { name: "Круасан", emoji: "🥐" }, { name: "Багет", emoji: "🥖" },
      { name: "Рататуй", emoji: "🍆" }, { name: "Цибулевий суп", emoji: "🍲" }, { name: "Еклери", emoji: "🥖" },
      { name: "Макарон", emoji: "🍡" }, { name: "Паелья", emoji: "🥘" }, { name: "Тапас", emoji: "🌮" },
      { name: "Гаспачо", emoji: "🍅" }, { name: "Чуррос", emoji: "🥨" }, { name: "Тако", emoji: "🌮" },
      { name: "Буріто", emoji: "🌯" }, { name: "Кесадилья", emoji: "🌮" }, { name: "Начос", emoji: "🧀" },
      { name: "Гуакамоле", emoji: "🥑" }, { name: "Енчилада", emoji: "🌯" }, { name: "Чилі кон карне", emoji: "🌶️" },
      { name: "Мусака", emoji: "🍆" }, { name: "Грецький салат", emoji: "🥗" }, { name: "Сувлакі", emoji: "🍢" },
      { name: "Гірос", emoji: "🥙" }, { name: "Дзадзикі", emoji: "🥣" }, { name: "Шніцель", emoji: "🥩" },
      { name: "Сосиски Братвурст", emoji: "🌭" }, { name: "Брецель", emoji: "🥨" }, { name: "Шварцвальдський торт", emoji: "🍰" },
      { name: "Фондю", emoji: "🧀" }, { name: "Раклет", emoji: "🧀" }, { name: "Гуляш", emoji: "🍲" },
      { name: "Лобстер", emoji: "🦞" }, { name: "Устриці", emoji: "🦪" }, { name: "Мідії у вині", emoji: "🐚" },
      { name: "Креветки на грилі", emoji: "🦐" }, { name: "Стейк із лосося", emoji: "🐟" }, { name: "Карпаччо", emoji: "🥩" },
      { name: "Тартар", emoji: "🥩" }, { name: "Салат Цезар", emoji: "🥗" }, { name: "Салат Олів'є", emoji: "🥗" },
      { name: "Вінегрет", emoji: "🥗" }, { name: "Окрошка", emoji: "🥣" }, { name: "Пельмені", emoji: "🥟" },
      { name: "Чебуреки", emoji: "🥟" }, { name: "Біляші", emoji: "🥟" }, { name: "Самса", emoji: "🥟" },
      { name: "Манти", emoji: "🥟" }, { name: "Кус-кус", emoji: "🍚" }, { name: "Тажин", emoji: "🥘" },
      { name: "Каррі з куркою", emoji: "🍛" }, { name: "Тікка Масала", emoji: "🍛" }, { name: "Наан", emoji: "🫓" },
      { name: "Самоса", emoji: "🥟" }, { name: "Путін", emoji: "🍟" }, { name: "Клем-чаудер", emoji: "🥣" },
      { name: "Маффіни", emoji: "🧁" }, { name: "Донати", emoji: "🍩" }, { name: "Чизкейк", emoji: "🍰" },
      { name: "Морозиво", emoji: "🍦" }
    ];

    function App() {
      const [searchQuery, setSearchQuery] = useState("");
      const [selectedDish, setSelectedDish] = useState(null);
      const [isModalOpen, setIsModalOpen] = useState(false);
      const [isLoadingRecipe, setIsLoadingRecipe] = useState(false);
      const [recipeData, setRecipeData] = useState(null);

      const filteredDishes = dishesList.filter(dish =>
        dish.name.toLowerCase().includes(searchQuery.toLowerCase())
      );

      const fetchRecipe = (dishName) => {
        setIsLoadingRecipe(true);
        setRecipeData(null);
        setIsModalOpen(true);

        setTimeout(() => {
          setRecipeData({
            description: `Традиційний та неймовірно смачний рецепт приготування страви «${dishName}», який підкорить ваші смакові рецептори.`,
            prepTime: "45 хв",
            difficulty: "Середньо",
            ingredients: [
              "Основний інгредієнт за смаком — 500 г",
              "Свіжа зелень та спеції — за смаком",
              "Олія або вершкове масло — 2 ст. л.",
              "Сіль, чорний перець — за смаком",
              "Часник — 1-2 зубчики"
            ],
            instructions: [
              "Підготуйте всі необхідні інгредієнти, помийте та очистьте їх за потреби.",
              "Наріжте основні компоненти відповідно до класичної рецептури.",
              "Розігрійте пательню або каструлю з додаванням олії.",
              "Обсмажуйте чи тушкуйте до золотистої скоринки та готовності.",
              "Подавайте гарячим, прикрасивши свіжою зеленню. Смачного!"
            ]
          });
          setIsLoadingRecipe(false);
        }, 600);
      };

      const handleDishClick = (dish) => {
        setSelectedDish(dish);
        fetchRecipe(dish.name);
      };

      const closeModal = () => {
        setIsModalOpen(false);
        setTimeout(() => {
          setSelectedDish(null);
          setRecipeData(null);
        }, 300);
      };

      useEffect(() => {
        const handleKeyDown = (e) => {
          if (e.key === 'Escape') closeModal();
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, []);

      const SkeletonLoader = () => (
        <div className="animate-pulse space-y-6">
          <div className="h-4 bg-orange-200 rounded w-3/4"></div>
          <div className="h-4 bg-orange-200 rounded w-1/2"></div>
          <div className="flex space-x-4 mt-4">
            <div className="h-8 bg-orange-200 rounded w-24"></div>
            <div className="h-8 bg-orange-200 rounded w-24"></div>
          </div>
          <div className="mt-8">
            <div className="h-6 bg-orange-300 rounded w-40 mb-4"></div>
            <div className="space-y-3">
              {[1, 2, 3, 4, 5].map((i) => (
                <div key={i} className="flex items-center space-x-2">
                  <div className="h-2 w-2 bg-orange-300 rounded-full"></div>
                  <div className="h-4 bg-orange-100 rounded w-full"></div>
                </div>
              ))}
            </div>
          </div>
          <div className="mt-8">
            <div className="h-6 bg-orange-300 rounded w-48 mb-4"></div>
            <div className="space-y-4">
              {[1, 2, 3, 4].map((i) => (
                <div key={i} className="space-y-2">
                  <div className="h-4 bg-orange-200 rounded w-full"></div>
                  <div className="h-4 bg-orange-100 rounded w-5/6"></div>
                </div>
              ))}
            </div>
          </div>
        </div>
      );

      return (
        <div className="min-h-screen bg-orange-50 font-sans text-stone-800">
          <header className="bg-gradient-to-r from-orange-500 to-red-500 text-white py-12 px-4 shadow-lg sticky top-0 z-10">
            <div className="max-w-6xl mx-auto text-center">
              <div className="flex justify-center items-center mb-4 space-x-3">
                <ChefHat size={48} className="text-orange-100 drop-shadow-md" />
                <h1 className="text-4xl md:text-5xl font-extrabold tracking-tight drop-shadow-md">
                  Смачний Світ
                </h1>
              </div>
              <p className="text-lg md:text-xl text-orange-100 max-w-2xl mx-auto mb-8 font-medium">
                100 найпопулярніших страв світу. Обирайте, що хочете скуштувати сьогодні, а наш шеф-кухар миттєво підготує для вас ідеальний рецепт!
              </p>
              <div className="relative max-w-md mx-auto">
                <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                  <Search className="h-5 w-5 text-orange-400" />
                </div>
                <input
                  type="text"
                  className="block w-full pl-10 pr-3 py-3 border-none rounded-full leading-5 bg-white text-stone-800 placeholder-stone-400 focus:outline-none focus:ring-4 focus:ring-orange-300 focus:ring-opacity-50 transition-shadow duration-200 shadow-inner text-lg"
                  placeholder="Шукати страву (напр. Борщ, Суші)..."
                  value={searchQuery}
                  onChange={(e) => setSearchQuery(e.target.value)}
                />
              </div>
            </div>
          </header>

          <main className="max-w-7xl mx-auto px-4 py-12">
            {filteredDishes.length === 0 ? (
              <div className="text-center py-20 text-stone-500">
                <Utensils className="mx-auto h-16 w-16 mb-4 text-orange-300" />
                <h2 className="text-2xl font-semibold">Страву не знайдено</h2>
                <p className="mt-2">Спробуйте змінити запит пошуку.</p>
              </div>
            ) : (
              <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4 md:gap-6">
                {filteredDishes.map((dish, index) => (
                  <button
                    key={index}
                    onClick={() => handleDishClick(dish)}
                    className="group flex flex-col items-center justify-center p-6 bg-white rounded-2xl shadow-sm border border-orange-100 hover:shadow-xl hover:border-orange-300 transform hover:-translate-y-1 transition-all duration-300 focus:outline-none focus:ring-4 focus:ring-orange-200"
                  >
                    <span className="text-5xl md:text-6xl mb-4 group-hover:scale-110 transition-transform duration-300 transform-origin-bottom drop-shadow-sm">
                      {dish.emoji}
                    </span>
                    <span className="text-center font-semibold text-stone-700 group-hover:text-orange-600 transition-colors text-sm md:text-base leading-tight">
                      {dish.name}
                    </span>
                  </button>
                ))}
              </div>
            )}
          </main>

          {isModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 sm:p-6">
              <div 
                className="fixed inset-0 bg-stone-900/60 backdrop-blur-sm transition-opacity"
                onClick={closeModal}
                aria-hidden="true"
              ></div>
              <div className="relative bg-white rounded-3xl shadow-2xl w-full max-w-3xl max-h-[90vh] flex flex-col overflow-hidden animate-in fade-in zoom-in-95 duration-300">
                <div className="flex items-center justify-between px-6 py-4 border-b border-orange-100 bg-orange-50/50">
                  <div className="flex items-center space-x-3">
                    <span className="text-3xl sm:text-4xl">{selectedDish?.emoji}</span>
                    <h2 className="text-2xl sm:text-3xl font-bold text-orange-900">
                      {selectedDish?.name}
                    </h2>
                  </div>
                  <button
                    onClick={closeModal}
                    className="p-2 text-stone-400 hover:text-red-500 hover:bg-red-50 rounded-full transition-colors focus:outline-none focus:ring-2 focus:ring-red-200"
                    aria-label="Закрити"
                  >
                    <X className="h-6 w-6" />
                  </button>
                </div>

                <div className="p-6 sm:p-8 overflow-y-auto flex-1 custom-scrollbar">
                  {isLoadingRecipe ? (
                    <div className="py-4">
                      <div className="flex justify-center mb-8">
                        <div className="relative flex items-center justify-center">
                           <ChefHat className="h-12 w-12 text-orange-400 animate-bounce" />
                           <div className="absolute -bottom-2 w-8 h-2 bg-orange-200 rounded-[50%] blur-sm opacity-60"></div>
                        </div>
                      </div>
                      <h3 className="text-center text-orange-600 font-medium mb-8 animate-pulse">
                        Шеф-кухар готує найкращий рецепт для вас...
                      </h3>
                      <SkeletonLoader />
                    </div>
                  ) : recipeData ? (
                    <div className="animate-in fade-in slide-in-from-bottom-4 duration-500">
                      <p className="text-stone-600 text-lg leading-relaxed mb-6 italic border-l-4 border-orange-300 pl-4 bg-orange-50/50 py-2">
                        {recipeData.description}
                      </p>
                      <div className="flex flex-wrap gap-4 mb-8">
                        <div className="flex items-center space-x-2 bg-orange-100 text-orange-800 px-4 py-2 rounded-full text-sm font-medium">
                          <Clock className="w-4 h-4" />
                          <span>{recipeData.prepTime}</span>
                        </div>
                        <div className="flex items-center space-x-2 bg-red-100 text-red-800 px-4 py-2 rounded-full text-sm font-medium">
                          <Flame className="w-4 h-4" />
                          <span>Складність: {recipeData.difficulty}</span>
                        </div>
                      </div>
                      <div className="grid md:grid-cols-3 gap-8">
                        <div className="md:col-span-1 bg-stone-50 rounded-2xl p-6 border border-stone-100 h-fit">
                          <h3 className="text-xl font-bold text-stone-800 mb-4 flex items-center">
                            <Utensils className="w-5 h-5 mr-2 text-orange-500" />
                            Інгредієнти
                          </h3>
                          <ul className="space-y-3">
                            {recipeData.ingredients.map((ingredient, idx) => (
                              <li key={idx} className="flex items-start">
                                <span className="inline-block w-1.5 h-1.5 rounded-full bg-orange-400 mt-2 mr-3 flex-shrink-0"></span>
                                <span className="text-stone-700">{ingredient}</span>
                              </li>
                            ))}
                          </ul>
                        </div>
                        <div className="md:col-span-2">
                          <h3 className="text-2xl font-bold text-stone-850 mb-6 flex items-center">
                            <ChefHat className="w-6 h-6 mr-2 text-orange-500" />
                            Приготування
                          </h3>
                          <div className="space-y-6">
                            {recipeData.instructions.map((step, idx) => (
                              <div key={idx} className="flex gap-4">
                                <div className="flex-shrink-0 w-8 h-8 rounded-full bg-orange-500 text-white flex items-center justify-center font-bold text-sm shadow-md">
                                  {idx + 1}
                                </div>
                                <p className="text-stone-700 leading-relaxed pt-1">
                                  {step}
                                </p>
                              </div>
                            ))}
                          </div>
                        </div>
                      </div>
                    </div>
                  ) : null}
                </div>
              </div>
            </div>
          )}

          <style dangerouslySetInnerHTML={{__html: `
            .custom-scrollbar::-webkit-scrollbar { width: 8px; }
            .custom-scrollbar::-webkit-scrollbar-track { background: #fdf6e3; border-radius: 4px; }
            .custom-scrollbar::-webkit-scrollbar-thumb { background: #fdba74; border-radius: 4px; }
            .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #f97316; }
          `}} />
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
