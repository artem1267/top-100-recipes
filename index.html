<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Смачний Світ - Топ 100 Рецептів</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-orange-50 text-stone-800 min-h-screen flex flex-col">

  <header class="bg-gradient-to-r from-orange-500 to-red-500 text-white py-10 px-4 shadow-lg sticky top-0 z-10">
    <div class="max-w-5xl mx-auto text-center">
      <h1 class="text-3xl md:text-5xl font-extrabold mb-3 flex items-center justify-center gap-3">
        <span>🍳</span> Смачний Світ
      </h1>
      <p class="text-orange-100 text-base md:text-lg mb-6 max-w-xl mx-auto">
        100 найпопулярніших страв світу. Обирай улюблену страву та готуй за найкращими рецептами!
      </p>
      <div class="relative max-w-md mx-auto">
        <input 
          type="text" 
          id="searchInput" 
          oninput="filterDishes()" 
          placeholder="Шукати страву (напр. Борщ, Роли, Піца)..." 
          class="w-full px-5 py-3.5 pl-11 rounded-full text-stone-800 bg-white placeholder-stone-400 focus:outline-none focus:ring-4 focus:ring-orange-300 shadow-md text-lg"
        />
        <svg class="absolute left-4 top-4 w-5 h-5 text-stone-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-10 flex-1 w-full">
    <div id="dishesGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4 md:gap-6">
      <!-- Страви генеруються через JS -->
    </div>
  </main>

  <!-- Модальне вікно рецепта -->
  <div id="recipeModal" class="fixed inset-0 bg-stone-900/60 backdrop-blur-sm hidden items-center justify-center p-4 z-50 transition-all">
    <div class="bg-white rounded-3xl shadow-2xl w-full max-w-3xl max-h-[90vh] flex flex-col overflow-hidden animate-in fade-in zoom-in-95">
      <div class="flex items-center justify-between px-6 py-4 bg-orange-50 border-b border-orange-100">
        <h2 id="modalTitle" class="text-2xl font-bold text-orange-900 flex items-center gap-2">Рецепт</h2>
        <button onclick="closeModal()" class="p-2 text-stone-400 hover:text-red-500 hover:bg-red-50 rounded-full transition text-xl font-bold w-10 h-10 flex items-center justify-center">&times;</button>
      </div>
      <div id="modalContent" class="p-6 md:p-8 overflow-y-auto space-y-6">
        <!-- Вміст рецепта -->
      </div>
    </div>
  </div>

  <script>
    const database = {
      "Борщ": {
        emoji: "🍲", time: "1 год 20 хв", diff: "Середньо",
        desc: "Традиційна українська страва з насиченим смаком та соковитими овочами.",
        ing: ["Яловичина або свинина — 500 г", "Буряк — 2 шт.", "Капуста — 300 г", "Картопля — 4 шт.", "Морква — 1 шт.", "Цибуля — 1 шт.", "Томатна паста — 2 ст. л."],
        inst: ["Відваріть м'ясо до готовності в підсоленій воді.", "Додайте нарізану картоплю та капусту.", "Зробіть зажарку: обсмажте тертий буряк, моркву та цибулю з томатною пастою.", "Додайте зажарку в суп, покладіть спеції та проваріть 10 хвилин."]
      },
      "Вареники": {
        emoji: "🥟", time: "50 хв", diff: "Середньо",
        desc: "Домашні вареники з ніжного тіста з картоплею або сиром.",
        ing: ["Борошно — 400 г", "Вода — 200 мл", "Яйце — 1 шт.", "Картопля або сир — 400 г", "Вершкове масло — 50 г"],
        inst: ["Замісіть м'яке еластичне тісто з борошна, води та яйця.", "Приготуйте улюблену начинку.", "Сформуйте вареники та опустіть у киплячу підсолену воду на 5-7 хвилин."]
      },
      "Роли Філадельфія": {
        emoji: "🍱", time: "45 хв", diff: "Складно",
        desc: "Легендарні роли з ніжним вершковим сиром та червоною рибою.",
        ing: ["Рис для суші — 250 г", "Листи норі — 3 шт.", "Слабосолоний лосось — 200 г", "Вершковий сир (Філадельфія) — 150 г", "Огірок — 1 шт."],
        inst: ["Відваріть рис для суші та заправте його рисовим оцтом.", "Викладіть рис на лист норі тонким шаром, переверніть рис вниз.", "Викладіть смужки вершкового сиру та огірка, загорніть у рулет за допомогою килимка.", "Зверху викладіть слайси лосося та наріжте рол на порції."]
      },
      "Роли Каліфорнія": {
        emoji: "🍱", time: "40 хв", diff: "Складно",
        desc: "Популярні роли в ікрі або кунжуті з крабовими паличками та авокадо.",
        ing: ["Рис для суші — 250 г", "Норі — 3 шт.", "Крабові палички — 150 г", "Авокадо — 1 шт.", "Майонер — 1 ст. л.", "Ікра летючої риби (тобіко) або кунжут"],
        inst: ["Підготуйте рис та викладіть його на норі.", "Зробіть начинку: змішайте подрібнені крабові палички з майонезом та додайте скибочки авокадо.", "Сформуйте рулет так, щоб рис опинився ззовні, обваляйте в ікрі та наріжте."]
      },
      "Піца Маргарита": {
        emoji: "🍕", time: "30 хв", diff: "Легко",
        desc: "Класична італійська піца з томатним соусом, моцарелою та базиліком.",
        ing: ["Тісто для піци — 1 шт.", "Томатний соус — 100 г", "Сир Моцарела — 150 г", "Свіжий базилік", "Оливкова олія"],
        inst: ["Розкачайте тісто, рівномірно змастіть томатним соусом.", "Викладіть шматочки моцарели зверху.", "Випікайте у розігрітій до 220°C духовці 10-12 хвилин."]
      },
      "Еклери": {
        emoji: "🥖", time: "1 год", diff: "Складно",
        desc: "Французьке тістечко із заварного тіста з кремовою начинкою.",
        ing: ["Вершкове масло — 100 г", "Вода — 125 мл", "Борошно — 150 г", "Яйця — 4 шт.", "Згущене молоко або крем — 300 г"],
        inst: ["Заваріть тісто у сотейнику з маслом, водою та борошном.", "По одному вбийте яйця, вимішуючи до гладкості.", "Відсадіть смужки на деко та випікайте при 200°C 20 хвилин, потім начиніть кремом."]
      },
      "Сирники": {
        emoji: "🥞", time: "25 хв", diff: "Легко",
        desc: "Ніжні та рум'яні домашні сирники для смачного сніданку.",
        ing: ["Сир кисломолочний — 400 г", "Яйце — 1 шт.", "Цукор — 2 ст. л.", "Борошно — 3 ст. л.", "Ванільний цукор"],
        inst: ["Розітріть сир з яйцем, звичайним та ванільним цукром.", "Додайте борошно і сформуйте невеликі кульки.", "Обсмажуйте на сковороді з олією по 3 хвилини з кожного боку до скоринки."]
      },
      "Тірамісу": {
        emoji: "🍰", time: "30 хв", diff: "Середньо",
        desc: "Повітряний італійський десерт з печивом савоярді та кавою.",
        ing: ["Сир Маскарпоне — 250 г", "Вершки (33%) — 200 мл", "Печиво Савоярді — 1 пачка", "Міцна кава — 200 мл", "Какао-порошок"],
        inst: ["Збийте маскарпоне з вершками та цукровою пудрою.", "Вмочіть печиво в охолоджену каву і викладіть у форму шаром.", "Покрийте кремом, повторіть шари та посипте зверху какао."]
      }
    };

    // Повний список зі 100 страв
    const allNames = [
      "Борщ", "Вареники", "Голубці", "Деруни", "Сало з часником", "Сирники", "Котлета по-київськи", "Млинці", "Капусняк", "Холодець", 
      "Піца Маргарита", "Спагеті Карбонара", "Лазанья", "Різотто", "Тірамісу", "Равіолі", "Паста Болоньєзе", "Суші", "Роли Каліфорнія", "Роли Філадельфія", 
      "Рамен", "Удон", "Том Ям", "Пад Тай", "Пекінська качка", "Фо Бо", "Хачапурі", "Хінкалі", "Шашлик", "Плов", 
      "Кебаб", "Шаурма", "Фалафель", "Хумус", "Бургер", "Чизбургер", "Хот-дог", "Стейк Рібай", "Картопля фрі", "Курячі нагетси", 
      "Крильця Баффало", "Панкейки", "Брауні", "Круасан", "Багет", "Рататуй", "Цибулевий суп", "Еклери", "Макарон", "Паелья", 
      "Тапас", "Гаспачо", "Чуррос", "Тако", "Буріто", "Кесадилья", "Начос", "Гуакамоле", "Енчилада", "Чилі кон карне", 
      "Мусака", "Грецький салат", "Сувлакі", "Гірос", "Дзадзикі", "Шніцель", "Сосиски Братвурст", "Брецель", "Шварцвальдський торт", "Фондю", 
      "Раклет", "Гуляш", "Лобстер", "Устриці", "Мідії у вині", "Креветки на грилі", "Стейк із лосося", "Карпаччо", "Тартар", "Салат Цезар", 
      "Салат Олів'є", "Вінегрет", "Окрошка", "Пельмені", "Чебуреки", "Біляші", "Самса", "Манти", "Кус-кус", "Тажин", 
      "Каррі з куркою", "Тікка Масала", "Наан", "Самоса", "Путін", "Клем-чаудер", "Маффіни", "Донати", "Чизкейк", "Морозиво"
    ];

    const emojisList = ["🍲", "🥟", "🥬", "🥔", "🥓", "🥞", "🍗", "🥞", "🍲", "🥩", "🍕", "🍝", "🥘", "🍚", "🍰", "🥟", "🍝", "🍣", "🍱", "🍱", "🍜", "🍜", "🍲", "🍝", "🦆", "🍜", "🧀", "🥟", "🍢", "🍛", "🌯", "🥙", "🧆", "🥣", "🍔", "🍔", "🌭", "🥩", "🍟", "🍗", "🍗", "🥞", "🍫", "🥐", "🥖", "🍆", "🍲", "🥖", "🍡", "🥘", "🌮", "🍅", "🥨", "🌮", "🌯", "🌮", "🧀", "🥑", "🌯", "🌶️", "🍆", "🥗", "🍢", "🥙", "🥣", "🥩", "🌭", "🥨", "🍰", "🧀", "🧀", "🍲", "🦞", "🦪", "🐚", "🦐", "🐟", "🥩", "🥩", "🥗", "🥗", "🥗", "🥣", "🥟", "🥟", "🥟", "🥟", "🥟", "🍚", "🥘", "🍛", "🍛", "🫓", "🥟", "🍟", "🥣", "🧁", "🍩", "🍰", "🍦"];

    const dishesList = allNames.map((name, idx) => {
      if (database[name]) {
        return { name, ...database[name] };
      }
      return {
        name: name,
        emoji: emojisList[idx % emojisList.length],
        time: "40 хв",
        diff: "Середньо",
        desc: `Покроковий класичний рецепт приготування апетитної страви «${name}».`,
        ing: [
          `Головні інгредієнти для страви — 500 г`,
          "Спеції, сіль та перець — за смаком",
          "Соус або олія для приготування — 2 ст. л.",
          "Свіжа зелень для подачі"
        ],
        inst: [
          "Підготуйте та ретельно помийте всі необхідні продукти.",
          "Наріжте або підготуйте компоненти згідно з традиційною технологією.",
          "Здійсніть термічну обробку (обсмажте, зваріть або запечіть до готовності).",
          "Подавайте страву гарячою, прикрасивши зеленню. Смачного!"
        ]
      };
    });

    function renderDishes(list) {
      const grid = document.getElementById("dishesGrid");
      if (list.length === 0) {
        grid.innerHTML = `<div class="col-span-full text-center py-20 text-stone-500 text-xl">Нічого не знайдено 😕</div>`;
        return;
      }
      grid.innerHTML = list.map(dish => `
        <button onclick="openRecipe('${dish.name}')" class="group flex flex-col items-center justify-center p-6 bg-white rounded-2xl shadow-sm border border-orange-100 hover:shadow-xl hover:border-orange-300 transition transform hover:-translate-y-1">
          <span class="text-6xl mb-3 group-hover:scale-110 transition">${dish.emoji}</span>
          <span class="font-semibold text-stone-700 text-base text-center group-hover:text-orange-600 transition">${dish.name}</span>
        </button>
      `).join('');
    }

    function filterDishes() {
      const query = document.getElementById("searchInput").value.toLowerCase();
      const filtered = dishesList.filter(d => d.name.toLowerCase().includes(query));
      renderDishes(filtered);
    }

    function openRecipe(dishName) {
      const recipe = dishesList.find(d => d.name === dishName);
      if (!recipe) return;

      const modal = document.getElementById("recipeModal");
      const title = document.getElementById("modalTitle");
      const content = document.getElementById("modalContent");

      title.innerHTML = `${recipe.emoji} ${recipe.name}`;
      content.innerHTML = `
        <p class="text-stone-600 text-lg italic border-l-4 border-orange-400 pl-4 py-1 bg-orange-50/50 rounded-r-xl">${recipe.desc}</p>
        <div class="flex flex-wrap gap-3 font-medium">
          <span class="bg-orange-100 text-orange-800 px-4 py-1.5 rounded-full text-sm">⏱ ${recipe.time}</span>
          <span class="bg-red-100 text-red-800 px-4 py-1.5 rounded-full text-sm">🔥 Складність: ${recipe.diff}</span>
        </div>
        <div class="grid md:grid-cols-3 gap-6 mt-4">
          <div class="md:col-span-1 bg-stone-50 p-5 rounded-2xl border border-stone-100 h-fit">
            <h3 class="font-bold text-lg text-stone-800 mb-3 flex items-center gap-2">🛒 Інгредієнти</h3>
            <ul class="space-y-2 text-stone-700 text-sm">
              ${recipe.ing.map(i => `<li class="flex items-start gap-2"><span class="text-orange-500 font-bold">•</span><span>${i}</span></li>`).join('')}
            </ul>
          </div>
          <div class="md:col-span-2 space-y-4">
            <h3 class="font-bold text-xl text-stone-800 flex items-center gap-2">👨‍🍳 Приготування</h3>
            <div class="space-y-3">
              ${recipe.inst.map((step, idx) => `
                <div class="flex gap-3 bg-stone-50/70 p-3.5 rounded-xl border border-stone-100">
                  <span class="flex-shrink-0 w-7 h-7 bg-orange-500 text-white rounded-full flex items-center justify-center font-bold text-sm">${idx + 1}</span>
                  <p class="text-stone-700 text-sm leading-relaxed pt-0.5">${step}</p>
                </div>
              `).join('')}
            </div>
          </div>
        </div>
      `;
      modal.classList.remove("hidden");
      modal.classList.add("flex");
    }

    function closeModal() {
      const modal = document.getElementById("recipeModal");
      modal.classList.remove("flex");
      modal.classList.add("hidden");
    }

    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeModal();
    });

    renderDishes(dishesList);
  </script>
</body>
</html>
