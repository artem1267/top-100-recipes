<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Смачний Світ - Топ 100 Рецептів</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-orange-50 text-stone-800 min-h-screen">

  <header class="bg-gradient-to-r from-orange-500 to-red-500 text-white py-10 px-4 shadow-lg sticky top-0 z-10">
    <div class="max-w-4xl mx-auto text-center">
      <h1 class="text-3xl md:text-4xl font-extrabold mb-2">🍳 Смачний Світ</h1>
      <p class="text-orange-100 text-sm md:text-base mb-6">Обирай страву, а ШІ-шеф миттєво підготує для тебе ідеальний рецепт!</p>
      <input 
        type="text" 
        id="searchInput" 
        oninput="filterDishes()" 
        placeholder="Шукати страву (напр. Борщ, Суші)..." 
        class="w-full max-w-md px-4 py-3 rounded-full text-stone-800 focus:outline-none focus:ring-4 focus:ring-orange-300 shadow-inner"
      />
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 py-8">
    <div id="dishesGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4">
      <!-- Страви генеруються через JS -->
    </div>
  </main>

  <!-- Модальне вікно рецепта -->
  <div id="recipeModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
    <div class="bg-white rounded-3xl shadow-2xl w-full max-w-2xl max-h-[90vh] flex flex-col overflow-hidden">
      <div class="flex items-center justify-between px-6 py-4 bg-orange-100 border-b">
        <h2 id="modalTitle" class="text-2xl font-bold text-orange-900">Рецепт</h2>
        <button onclick="closeModal()" class="text-stone-500 hover:text-red-500 text-2xl font-bold">&times;</button>
      </div>
      <div id="modalContent" class="p-6 overflow-y-auto space-y-4">
        <!-- Вміст рецепта -->
      </div>
    </div>
  </div>

  <script>
    const API_KEY = "AQ.Ab8RN6K61K5pV7OHrQy4NQFcKK4BcedaiPdEjgyAmdRTSNGW3Q";

    const dishes = [
      { name: "Борщ", emoji: "🍲" }, { name: "Вареники", emoji: "🥟" }, { name: "Голубці", emoji: "🥬" },
      { name: "Деруни", emoji: "🥔" }, { name: "Сало з часником", emoji: "🥓" }, { name: "Сирники", emoji: "🥞" },
      { name: "Котлета по-київськи", emoji: "🍗" }, { name: "Млинці", emoji: "🥞" }, { name: "Піца Маргарита", emoji: "🍕" },
      { name: "Спагеті Карбонара", emoji: "🍝" }, { name: "Суші", emoji: "🍣" }, { name: "Роли Філадельфія", emoji: "🍱" },
      { name: "Рамен", emoji: "🍜" }, { name: "Том Ям", emoji: "🍲" }, { name: "Хачапурі", emoji: "🧀" },
      { name: "Хінкалі", emoji: "🥟" }, { name: "Шашлик", emoji: "🍢" }, { name: "Плов", emoji: "🍛" },
      { name: "Шаурма", emoji: "🥙" }, { name: "Бургер", emoji: "🍔" }, { name: "Стейк Рібай", emoji: "🥩" },
      { name: "Картопля фрі", emoji: "🍟" }, { name: "Круасан", emoji: "🥐" }, { name: "Рататуй", emoji: "🍆" },
      { name: "Паелья", emoji: "🥘" }, { name: "Тако", emoji: "🌮" }, { name: "Грецький салат", emoji: "🥗" },
      { name: "Шніцель", emoji: "🥩" }, { name: "Чизкейк", emoji: "🍰" }, { name: "Морозиво", emoji: "🍦" }
    ];

    function renderDishes(list) {
      const grid = document.getElementById("dishesGrid");
      grid.innerHTML = list.map(dish => `
        <button onclick="openRecipe('${dish.name}', '${dish.emoji}')" class="flex flex-col items-center justify-center p-5 bg-white rounded-2xl shadow-sm border border-orange-100 hover:shadow-lg hover:border-orange-300 transition transform hover:-translate-y-1">
          <span class="text-5xl mb-2">${dish.emoji}</span>
          <span class="font-semibold text-stone-700 text-sm md:text-base text-center">${dish.name}</span>
        </button>
      `).join('');
    }

    function filterDishes() {
      const query = document.getElementById("searchInput").value.toLowerCase();
      const filtered = dishes.filter(d => d.name.toLowerCase().includes(query));
      renderDishes(filtered);
    }

    async function openRecipe(dishName, emoji) {
      const modal = document.getElementById("recipeModal");
      const title = document.getElementById("modalTitle");
      const content = document.getElementById("modalContent");

      title.innerHTML = `${emoji} ${dishName}`;
      content.innerHTML = `<div class="text-center py-10 text-orange-600 font-medium animate-pulse">Шеф-кухар штучного інтелекту готує рецепт... 🍳</div>`;
      modal.classList.remove("hidden");
      modal.classList.add("flex");

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{
              parts: [{ text: `Напиши детальний рецепт страви: ${dishName} українською мовою. Надай опис, час приготування, складність, список інгредієнтів та покрокову інструкцію у форматі JSON з полями: description, prepTime, difficulty, ingredients (масив рядків), instructions (масив рядків). Поверни ТІЛЬКИ валідний JSON без додаткового форматування чи markdown.` }]
            }]
          })
        });

        const data = await response.json();
        const textResponse = data.candidates[0].content.parts[0].text;
        
        // Очищаємо від markdown обгорток якщо вони є
        const cleanJson = textResponse.replace(/```json/g, '').replace(/```/g, '').trim();
        const recipe = JSON.parse(cleanJson);

        content.innerHTML = `
          <p class="text-stone-600 italic border-l-4 border-orange-400 pl-4 py-1">${recipe.description}</p>
          <div class="flex gap-4 text-sm font-medium">
            <span class="bg-orange-100 text-orange-800 px-3 py-1 rounded-full">⏱ ${recipe.prepTime}</span>
            <span class="bg-red-100 text-red-800 px-3 py-1 rounded-full">🔥 ${recipe.difficulty}</span>
          </div>
          <div>
            <h3 class="font-bold text-lg text-stone-800 mb-2">🛒 Інгредієнти:</h3>
            <ul class="list-disc list-inside space-y-1 text-stone-700">
              ${recipe.ingredients.map(i => `<li>${i}</li>`).join('')}
            </ul>
          </div>
          <div>
            <h3 class="font-bold text-lg text-stone-800 mb-2">👨‍🍳 Приготування:</h3>
            <ol class="list-decimal list-inside space-y-2 text-stone-700">
              ${recipe.instructions.map(step => `<li class="pl-1">${step}</li>`).join('')}
            </ol>
          </div>
        `;
      } catch (err) {
        content.innerHTML = `<p class="text-red-500 text-center py-6">Не вдалося завантажити рецепт через ШІ. Спробуй ще раз пізніше!</p>`;
      }
    }

    function closeModal() {
      const modal = document.getElementById("recipeModal");
      modal.classList.remove("flex");
      modal.classList.add("hidden");
    }

    // Завантажити початковий список
    renderDishes(dishes);
  </script>
</body>
</html>
