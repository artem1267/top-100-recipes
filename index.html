<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Смачний Світ - Топ 100 Рецептів</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-orange-50 text-stone-800 min-h-screen flex flex-col">

  <header class="bg-gradient-to-r from-orange-500 to-red-500 text-white py-10 px-4 shadow-lg sticky top-0 z-10">
    <div class="max-w-5xl mx-auto text-center">
      <h1 class="text-3xl md:text-5xl font-extrabold mb-3 flex items-center justify-center gap-3">
        <span>🍳</span> Смачний Світ
      </h1>
      <p class="text-orange-100 text-base md:text-lg mb-6 max-w-xl mx-auto">
        100 найпопулярніших страв світу. Обирай улюблешу страву та готуй за найкращими рецептами!
      </p>
      <div class="relative max-w-md mx-auto">
        <input 
          type="text" 
          id="searchInput" 
          oninput="filterDishes()" 
          placeholder="Шукати страву (напр. Борщ, Суші, Піца)..." 
          class="w-full px-5 py-3.5 pl-11 rounded-full text-stone-800 bg-white placeholder-stone-400 focus:outline-none focus:ring-4 focus:ring-orange-300 shadow-md text-lg"
        />
        <svg class="absolute left-4 top-4 w-5 h-5 text-stone-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-10 flex-1 w-full">
    <div id="dishesGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4 md:gap-6">
      <!-- Страви генеруються через JS -->
    </div>
  </main>

  <!-- Модальне вікно рецепта -->
  <div id="recipeModal" class="fixed inset-0 bg-stone-900/60 backdrop-blur-sm hidden items-center justify-center p-4 z-50 transition-all">
    <div class="bg-white rounded-3xl shadow-2xl w-full max-w-3xl max-h-[90vh] flex flex-col overflow-hidden animate-in fade-in zoom-in-95">
      <div class="flex items-center justify-between px-6 py-4 bg-orange-50 border-b border-orange-100">
        <h2 id="modalTitle" class="text-2xl font-bold text-orange-900 flex items-center gap-2">Рецепт</h2>
        <button onclick="closeModal()" class="p-2 text-stone-400 hover:text-red-500 hover:bg-red-50 rounded-full transition text-xl font-bold w-10 h-10 flex items-center justify-center">&times;</button>
      </div>
      <div id="modalContent" class="p-6 md:p-8 overflow-y-auto space-y-6">
        <!-- Вміст рецепта -->
      </div>
    </div>
  </div>

  <script>
    const dishes = [
      { 
        name: "Борщ", emoji: "🍲", 
        description: "Традиційна українська страва з насиченим смаком, ароматом спецій та соковитими овочами.",
        prepTime: "1 година 20 хв", difficulty: "Середньо",
        ingredients: ["Яловичина або свинина — 500 г", "Буряк — 2 шт.", "Капуста — 300 г", "Картопля — 4 шт.", "Морква — 1 шт.", "Цибуля — 1 шт.", "Томатна паста — 2 ст. л.", "Часник, зелень, спеції — за смаком"],
        instructions: ["Відваріть м'ясо до готовності в підсоленій воді.", "Наріжте картоплю кубиками та додайте в бульйон.", "Наріжте капусту і додайте слідом за картоплею.", "Зробіть зажарку: обсмажте натертий буряк, моркву та цибулю з томатною пастою.", "Додайте зажарку в каструлю, покладіть часник та спеції, варіть ще 10 хвилин.", "Подавайте зі сметаною та свіжою зеленню."]
      },
      { 
        name: "Вареники", emoji: "🥟", 
        description: "Апетитні домашні вареники з ніжного тіста з улюбленою начинкою та золотавою засмажкою.",
        prepTime: "50 хв", difficulty: "Середньо",
        ingredients: ["Борошно пшеничне — 400 г", "Вода (тепла) — 200 мл", "Яйце — 1 шт.", "Картопля або сир — 400 г", "Цибуля — 1 шт.", "Вершкове масло — 50 г", "Сіль — за смаком"],
        instructions: ["Замісіть м'яке еластичне тісто з борошна, води, яйця та дрібки солі.", "Приготуйте начинку (наприклад, відваріть картоплю та потовчіть її з цибулею).", "Розкачайте тісто, виріжте кружечки та сформуйте вареники, щільно заліплюючи краї.", "Опустіть вареники в киплячу підсолену воду і варіть 5-7 хвилин після спливання.", "Заправте готові вареники вершковим маслом."]
      },
      { 
        name: "Піца Маргарита", emoji: "🍕", 
        description: "Класична італійська піца з тонким тістом, ароматними томатами, свіжою моцарелою та базиліком.",
        prepTime: "40 хв", difficulty: "Легко",
        ingredients: ["Тісто для піци — 1 шт.", "Томатний соус — 100 г", "Сир Моцарела — 150 г", "Свіжий базилік — кілька листочків", "Оливкова олія — 1 ст. л."],
        instructions: ["Розкачайте тісто для піци на пергаментному папері.", "Рівномірно змастіть основу томатним соусом.", "Викладіть зверху нарізану або порвану шматочками моцарелу.", "Випікайте у розігрітій до 220°C духовці приблизно 10–12 хвилин.", "Перед подачею прикрасьте свіжим базиліком і збризніть оливковою олією."]
      },
      { 
        name: "Суші", emoji: "🍣", 
        description: "Популярна японська страва з ідеально звареного рису, свіжої риби та норі.",
        prepTime: "50 хв", difficulty: "Складно",
        ingredients: ["Рис для суші — 300 г", "Рисовий оцет — 3 ст. л.", "Листи норі — 5 шт.", "Свіжий лосось — 200 г", "Вершковий сир — 150 г", "Огірок — 1 шт."],
        instructions: ["Промийте рис і відваріть за спеціальною технологією, заправте рисовим оцтом.", "Викладіть рис на лист норі, залишаючи вільний край.", "Додайте смужки лосося, вершкового сиру та огірка.", "Акуратно скрутіть у щільний рулет за допомогою бамбукового килимка.", "Наріжте на порційні шматочки гострим ножем."]
      },
      { 
        name: "Сирники", emoji: "🥞", 
        description: "Ніжні, рум'яні та неймовірно смачні сирники з кисломолочного сиру для ідеального сніданку.",
        prepTime: "25 хв", difficulty: "Легко",
        ingredients: ["Кисломолочний сир (9%) — 400 г", "Яйце — 1 шт.", "Цукор — 2 ст. л.", "Борошно — 3 ст. л. (+ для панірування)", "Ванільний цукор — 1 пакетик", "Олія для смаження"],
        instructions: ["Ретельно розітріть сир з яйцем, звичайним та ванільним цукром.", "Додайте борошно і знову перемішайте до однорідної маси.", "Сформуйте невеликі кульки, обваляйте їх у борошні та сплюсніть у вигляді шайбочок.", "Обсмажуйте на розігрітій сковороді з олією по 3-4 хвилини з кожного боку до золотавої скоринки.", "Подавайте зі сметаною, медом або варенням."]
      }
    ];

    // Доповнимо список для всіх інших страв універсальним генератором, щоб кожна кнопка відкривала гарний рецепт
    const allDishNames = [
      "Борщ", "Вареники", "Голубці", "Деруни", "Сало з часником", "Сирники", "Котлета по-київськи", "Млинці", "Капусняк", "Холодець", 
      "Піца Маргарита", "Спагеті Карбонара", "Лазанья", "Різотто", "Тірамісу", "Равіолі", "Паста Болоньєзе", "Суші", "Роли Каліфорнія", "Роли Філадельфія", 
      "Рамен", "Удон", "Том Ям", "Пад Тай", "Пекінська качка", "Фо Бо", "Хачапурі", "Хінкалі", "Шашлик", "Плов", 
      "Кебаб", "Шаурма", "Фалафель", "Хумус", "Бургер", "Чизбургер", "Хот-дог", "Стейк Рібай", "Картопля фрі", "Курячі нагетси", 
      "Крильця Баффало", "Панкейки", "Брауні", "Круасан", "Багет", "Рататуй", "Цибулевий суп", "Еклери", "Макарон", "Паелья", 
      "Тапас", "Гаспачо", "Чуррос", "Тако", "Буріто", "Кесадилья", "Начос", "Гуакамоле", "Енчилада", "Чилі кон карне", 
      "Мусака", "Грецький салат", "Сувлакі", "Гірос", "Дзадзикі", "Шніцель", "Сосиски Братвурст", "Брецель", "Шварцвальдський торт", "Фондю", 
      "Раклет", "Гуляш", "Лобстер", "Устриці", "Мідії у вині", "Креветки на грилі", "Стейк із лосося", "Карпаччо", "Тартар", "Салат Цезар", 
      "Салат Олів'є", "Вінегрет", "Окрошка", "Пельмені", "Чебуреки", "Біляші", "Самса", "Манти", "Кус-кус", "Тажин", 
      "Каррі з куркою", "Тікка Масала", "Наан", "Самоса", "Путін", "Клем-чаудер", "Маффіни", "Донати", "Чизкейк", "Морозиво"
    ];

    const emojis = ["🍲", "🥟", "🥬", "🥔", "🥓", "🥞", "🍗", "🥞", "🍲", "🥩", "🍕", "🍝", "🥘", "🍚", "🍰", "🥟", "🍝", "🍣", "🍱", "🍱", "🍜", "🍜", "🍲", "🍝", "🦆", "🍜", "🧀", "🥟", "🍢", "🍛", "🌯", "🥙", "🧆", "🥣", "🍔", "🍔", "🌭", "🥩", "🍟", "🍗", "🍗", "🥞", "🍫", "🥐", "🥖", "🍆", "🍲", "🥖", "🍡", "🥘", "🌮", "🍅", "🥨", "🌮", "🌯", "🌮", "🧀", "🥑", "🌯", "🌶️", "🍆", "🥗", "🍢", "🥙", "🥣", "🥩", "🌭", "🥨", "🍰", "🧀", "🧀", "🍲", "🦞", "🦪", "🐚", "🦐", "🐟", "🥩", "🥩", "🥗", "🥗", "🥗", "🥣", "🥟", "🥟", "🥟", "🥟", "🥟", "🍚", "🥘", "🍛", "🍛", "🫓", "🥟", "🍟", "🥣", "🧁", "🍩", "🍰", "🍦"];

    // Формуємо повний масив зі 100 страв
    const fullDishesList = allDishNames.map((name, index) => {
      const existing = dishes.find(d => d.name === name);
      if (existing) return existing;
      return {
        name: name,
        emoji: emojis[index % emojis.length],
        description: `Справжній класичний рецепт приготування всесвітньо відомої страви «${name}» з чудовим смаком та ароматом.`,
        prepTime: "35–45 хв",
        difficulty: "Середньо",
        ingredients: [
          `Головний інгредієнт страви — 500 г`,
          `Свіжі овочі та зелень — 200 г`,
          `Оливкова або соняшникова олія — 2 ст. л.`,
          `Сіль, перець та улюблені спеції — за смаком`
        ],
        instructions: [
          "Підготуйте всі необхідні продукти, ретельно їх вимийте та обсушіть.",
          "Наріжте компоненти відповідно до традиційної технології приготування.",
          "Розігрійте сковороду, каструлю або духовку до оптимальної температури.",
          "Здійсніть термічну обробку до появи апетитної скоринки та повної готовності.",
          "Подавайте страву гарячою, прикрасивши зеленню. Смачного!"
        ]
      };
    });

    function renderDishes(list) {
      const grid = document.getElementById("dishesGrid");
      if (list.length === 0) {
        grid.innerHTML = `<div class="col-span-full text-center py-20 text-stone-500 text-xl">Нічого не знайдено 😕</div>`;
        return;
      }
      grid.innerHTML = list.map(dish => `
        <button onclick="openRecipe('${dish.name}')" class="group flex flex-col items-center justify-center p-6 bg-white rounded-2xl shadow-sm border border-orange-100 hover:shadow-xl hover:border-orange-300 transition transform hover:-translate-y-1">
          <span class="text-6xl mb-3 group-hover:scale-110 transition">${dish.emoji}</span>
          <span class="font-semibold text-stone-700 text-base text-center group-hover:text-orange-600 transition">${dish.name}</span>
        </button>
      `).join('');
    }

    function filterDishes() {
      const query = document.getElementById("searchInput").value.toLowerCase();
      const filtered = fullDishesList.filter(d => d.name.toLowerCase().includes(query));
      renderDishes(filtered);
    }

    function openRecipe(dishName) {
      const recipe = fullDishesList.find(d => d.name === dishName);
      if (!recipe) return;

      const modal = document.getElementById("recipeModal");
      const title = document.getElementById("modalTitle");
      const content = document.getElementById("modalContent");

      title.innerHTML = `${recipe.emoji} ${recipe.name}`;
      content.innerHTML = `
        <p class="text-stone-600 text-lg italic border-l-4 border-orange-400 pl-4 py-1 bg-orange-50/50 rounded-r-xl">${recipe.description}</p>
        <div class="flex flex-wrap gap-3 font-medium">
          <span class="bg-orange-100 text-orange-800 px-4 py-1.5 rounded-full text-sm">⏱ ${recipe.prepTime}</span>
          <span class="bg-red-100 text-red-800 px-4 py-1.5 rounded-full text-sm">🔥 Складність: ${recipe.difficulty}</span>
        </div>
        <div class="grid md:grid-cols-3 gap-6 mt-4">
          <div class="md:col-span-1 bg-stone-50 p-5 rounded-2xl border border-stone-100 h-fit">
            <h3 class="font-bold text-lg text-stone-800 mb-3 flex items-center gap-2">🛒 Інгредієнти</h3>
            <ul class="space-y-2 text-stone-700 text-sm">
              ${recipe.ingredients.map(i => `<li class="flex items-start gap-2"><span class="text-orange-500 font-bold">•</span><span>${i}</span></li>`).join('')}
            </ul>
          </div>
          <div class="md:col-span-2 space-y-4">
            <h3 class="font-bold text-xl text-stone-800 flex items-center gap-2">👨‍🍳 Приготування</h3>
            <div class="space-y-3">
              ${recipe.instructions.map((step, idx) => `
                <div class="flex gap-3 bg-stone-50/70 p-3.5 rounded-xl border border-stone-100">
                  <span class="flex-shrink-0 w-7 h-7 bg-orange-500 text-white rounded-full flex items-center justify-center font-bold text-sm">${idx + 1}</span>
                  <p class="text-stone-700 text-sm leading-relaxed pt-0.5">${step}</p>
                </div>
              `).join('')}
            </div>
          </div>
        </div>
      `;
      modal.classList.remove("hidden");
      modal.classList.add("flex");
    }

    function closeModal() {
      const modal = document.getElementById("recipeModal");
      modal.classList.remove("flex");
      modal.classList.add("hidden");
    }

    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeModal();
    });

    renderDishes(fullDishesList);
  </script>
</body>
</html>
