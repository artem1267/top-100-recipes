<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Смачний Світ - Топ 100 Рецептів</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-orange-50 text-stone-800 min-h-screen flex flex-col">

  <header class="bg-gradient-to-r from-orange-500 to-red-500 text-white py-10 px-4 shadow-lg sticky top-0 z-10">
    <div class="max-w-5xl mx-auto text-center">
      <h1 class="text-3xl md:text-5xl font-extrabold mb-3 flex items-center justify-center gap-3">
        <span>🍳</span> Смачний Світ
      </h1>
      <p class="text-orange-100 text-base md:text-lg mb-6 max-w-xl mx-auto">
        100 найпопулярніших страв світу. Обирай улюблену страву та готуй за найкращими рецептами!
      </p>
      <div class="relative max-w-md mx-auto">
        <input 
          type="text" 
          id="searchInput" 
          oninput="filterDishes()" 
          placeholder="Шукати страву (напр. Борщ, Голубці, Суші)..." 
          class="w-full px-5 py-3.5 pl-11 rounded-full text-stone-800 bg-white placeholder-stone-400 focus:outline-none focus:ring-4 focus:ring-orange-300 shadow-md text-lg"
        />
        <svg class="absolute left-4 top-4 w-5 h-5 text-stone-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-10 flex-1 w-full">
    <div id="dishesGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4 md:gap-6">
      <!-- Страви генеруються через JS -->
    </div>
  </main>

  <!-- Модальне вікно рецепта -->
  <div id="recipeModal" class="fixed inset-0 bg-stone-900/60 backdrop-blur-sm hidden items-center justify-center p-4 z-50 transition-all">
    <div class="bg-white rounded-3xl shadow-2xl w-full max-w-3xl max-h-[90vh] flex flex-col overflow-hidden animate-in fade-in zoom-in-95">
      <div class="flex items-center justify-between px-6 py-4 bg-orange-50 border-b border-orange-100">
        <h2 id="modalTitle" class="text-2xl font-bold text-orange-900 flex items-center gap-2">Рецепт</h2>
        <button onclick="closeModal()" class="p-2 text-stone-400 hover:text-red-500 hover:bg-red-50 rounded-full transition text-xl font-bold w-10 h-10 flex items-center justify-center">&times;</button>
      </div>
      <div id="modalContent" class="p-6 md:p-8 overflow-y-auto space-y-6">
        <!-- Вміст рецепта -->
      </div>
    </div>
  </div>

  <script>
    // Шаблони для різних типів страв, щоб усе завжди виглядало логічно й смачно
    const templates = {
      soup: {
        time: "1 год 10 хв", diff: "Середньо",
        getIng: (name) => [`Основний компонент (${name}) — 500 г`, "Картопля — 4 шт.", "Морква та цибуля — по 1 шт.", "Свіжа зелень та часник", "Сіль, спеції — за смаком"],
        getInst: (name) => [`Підготуйте та очистіть овочі для страви ${name}.`, "Поставте варитися бульйон або основу в каструлі.", "Додайте нарізані овочі та спеції, варіть на середньому вогні до готовності.", "Подавайте гарячим зі свіжою зеленню та сметаною."]
      },
      meat: {
        time: "50 хв", diff: "Середньо",
        getIng: (name) => [`М'ясо або основний продукт для ${name} — 600 г`, "Цибуля ріпчаста — 2 шт.", "Часник — 2 зубчики", "Олія або масло для смаження", "Сіль, чорний перець, паприка"],
        getInst: (name) => [`Промийте та наріжте порційними шматочками ${name}.`, "Замаринуйте у спеціях, часнику та цибулі на 15 хвилин.", "Обсмажте на розігрітій сковороді або запечіть у духовці до апетитної скоринки.", "Подавайте гарячою з улюбленим соусом."]
      },
      rolls: {
        time: "45 хв", diff: "Складно",
        getIng: (name) => [`Рис для суші — 250 г`, "Листи норі — 3 шт.", "Риба або начинка для ${name} — 200 г", "Вершковий сир — 150 г", "Огірок або авокадо — 1 шт."],
        getInst: () => ["Відваріть рис і заправте його спеціальним оцтом.", "Викладіть рис та начинку на лист норі.", "Акуратно сформуйте рулет за допомогою бамбукового килимка.", "Наріжте на порційні шматочки гострим ножем."]
      },
      pastry: {
        time: "40 хв", diff: "Легко",
        getIng: (name) => [`Борошно пшеничне — 400 г`, "Молоко або вода — 200 мл", "Яйця — 2 шт.", "Цукор або сіль — за смаком", "Масло для випікання — 50 г"],
        getInst: () => ["Змішайте всі інгредієнти до однорідного тіста без грудочок.", "Розігрійте сковороду або духовку.", "Випікайте виріб до золотавого кольору з обох боків.", "Подавайте теплим до столу."]
      },
      salad: {
        time: "20 хв", diff: "Легко",
        getIng: (name) => [`Свіжі овочі або інгредієнти для ${name} — 400 г`, "Оливкова олія або соус — 2 ст. л.", "Лимонний сік — 1 ст. л.", "Сіль та зелень за смаком"],
        getInst: () => ["Ретельно вимийте та обсушіть усі інгредієнти.", "Наріжте кубиками або соломкою у салатник.", "Заправте олією або соусом, обережно перемішайте та подавайте."]
      },
      dessert: {
        time: "35 хв", diff: "Середньо",
        getIng: (name) => [`Основа для десерту ${name} — 300 г`, "Цукор або пудра — 100 г", "Вершки або молоко — 150 мл", "Ваніль чи шоколад за смаком"],
        getInst: () => ["Підготуйте всі компоненти для солодкої страви.", "Змішайте крем та збийте до повітряної текстури.", "Сформуйте десерт і охолодіть у холодильнику перед подачею."]
      }
    };

    // Точні індивідуальні рецепти для найпопулярніших страв
    const customDatabase = {
      "Борщ": { emoji: "🍲", time: "1 год 20 хв", diff: "Середньо", desc: "Традиційна українська страва з насиченим смаком.", ing: ["Яловичина — 500 г", "Буряк — 2 шт.", "Капуста — 300 г", "Картопля — 4 шт.", "Морква та цибуля — по 1 шт.", "Томатна паста — 2 ст. л."], inst: ["Відваріть м'ясо до готовності.", "Додайте нарізану картоплю та капусту.", "Зробіть зажарку з буряка, моркви та цибулі з томатною пастою.", "З'єднайте все разом, проваріть 10 хвилин і подавайте зі сметаною."] },
      "Вареники": { emoji: "🥟", time: "50 хв", diff: "Середньо", desc: "Домашні вареники з ніжного тіста.", ing: ["Борошно — 400 г", "Вода — 200 мл", "Яйце — 1 шт.", "Картопля або сир — 400 г", "Вершкове масло"], inst: ["Замісіть м'яке тісто.", "Приготуйте улюблену начинку.", "Сформуйте вареники та відваріть у підсоленій воді 5-7 хвилин."] },
      "Голубці": { emoji: "🥬", time: "1 год 30 хв", diff: "Середньо", desc: "Соковиті м'ясні голубці у свіжому капустяному листі.", ing: ["Капуста білокачанна — 1 качан", "Фарш (свинина+яловичина) — 500 г", "Рис — 150 г", "Морква та цибуля — по 1 шт.", "Томатний соус — 200 г"], inst: ["Відваріть капустяні листи до м'якості.", "Змішайте фарш з напівзвареним рисом, сіллю та спеціями.", "Загорніть фарш у капустяні листи конвертиками.", "Складіть у каструлю, залийте томатним соусом і тушкуйте 50 хвилин."] },
      "Шашлик": { emoji: "🍢", time: "1 год", diff: "Легко", desc: "Соковите м'ясо на шпажках або мангалі.", ing: ["Свинина або курятина — 800 г", "Цибуля — 4 шт.", "Оцет або кефір — 100 мл", "Сіль, спеції для шашлику"], inst: ["Наріжте м'ясо шматочками.", "Замаринуйте з цибулею та спеціями мінімум на 2 години.", "Нанизайте на шампури та смажте до готовності."] },
      "Роли Філадельфія": { emoji: "🍱", time: "45 хв", diff: "Складно", desc: "Легендарні роли з вершковим сиром та лососем.", ing: ["Рис для суші — 250 г", "Норі — 3 шт.", "Лосось — 200 г", "Вершковий сир — 150 г", "Огірок — 1 шт."], inst: ["Відваріть рис і заправте оцтом.", "Викладіть рис на норі, перегорніть.", "Додайте сир і огірок, заверніть рулет.", "Зверху викладіть слайси лосося."] },
      "Сирники": { emoji: "🥞", time: "25 хв", diff: "Легко", desc: "Ніжні домашні сирники для сніданку.", ing: ["Сир кисломолочний — 400 г", "Яйце — 1 шт.", "Цукор — 2 ст. л.", "Борошно — 3 ст. л."], inst: ["Розітріть сир з яйцем і цукром.", "Додайте борошно, сформуйте кульки.", "Обсмажте на сковороді до золотистої скоринки."] }
    };

    // Список усіх 100 страв з категоріями
    const allNames = [
      { name: "Борщ", cat: "soup" }, { name: "Вареники", cat: "dessert" }, { name: "Голубці", cat: "meat" },
      { name: "Деруни", cat: "pastry" }, { name: "Сало з часником", cat: "meat" }, { name: "Сирники", cat: "dessert" },
      { name: "Котлета по-київськи", cat: "meat" }, { name: "Млинці", cat: "pastry" }, { name: "Капусняк", cat: "soup" },
      { name: "Холодець", cat: "meat" }, { name: "Піца Маргарита", cat: "pastry" }, { name: "Спагеті Карбонара", cat: "meat" },
      { name: "Лазанья", cat: "meat" }, { name: "Різотто", cat: "soup" }, { name: "Тірамісу", cat: "dessert" },
      { name: "Равіолі", cat: "pastry" }, { name: "Паста Болоньєзе", cat: "meat" }, { name: "Суші", cat: "rolls" },
      { name: "Роли Каліфорнія", cat: "rolls" }, { name: "Роли Філадельфія", cat: "rolls" }, { name: "Рамен", cat: "soup" },
      { name: "Удон", cat: "meat" }, { name: "Том Ям", cat: "soup" }, { name: "Пад Тай", cat: "meat" },
      { name: "Пекінська качка", cat: "meat" }, { name: "Фо Бо", cat: "soup" }, { name: "Хачапурі", cat: "pastry" },
      { name: "Хінкалі", cat: "meat" }, { name: "Шашлик", cat: "meat" }, { name: "Плов", cat: "meat" },
      { name: "Кебаб", cat: "meat" }, { name: "Шаурма", cat: "meat" }, { name: "Фалафель", cat: "pastry" },
      { name: "Хумус", cat: "salad" }, { name: "Бургер", cat: "meat" }, { name: "Чизбургер", cat: "meat" },
      { name: "Хот-дог", cat: "meat" }, { name: "Стейк Рібай", cat: "meat" }, { name: "Картопля фрі", cat: "pastry" },
      { name: "Курячі нагетси", cat: "meat" }, { name: "Крильця Баффало", cat: "meat" }, { name: "Панкейки", cat: "pastry" },
      { name: "Брауні", cat: "dessert" }, { name: "Круасан", cat: "pastry" }, { name: "Багет", cat: "pastry" },
      { name: "Рататуй", cat: "salad" }, { name: "Цибулевий суп", cat: "soup" }, { name: "Еклери", cat: "dessert" },
      { name: "Макарон", cat: "dessert" }, { name: "Паелья", cat: "meat" }, { name: "Тапас", cat: "salad" },
      { name: "Гаспачо", cat: "soup" }, { name: "Чуррос", cat: "dessert" }, { name: "Тако", cat: "meat" },
      { name: "Буріто", cat: "meat" }, { name: "Кесадилья", cat: "meat" }, { name: "Начос", cat: "salad" },
      { name: "Гуакамоле", cat: "salad" }, { name: "Енчилада", cat: "meat" }, { name: "Чилі кон карне", cat: "meat" },
      { name: "Мусака", cat: "meat" }, { name: "Грецький салат", cat: "salad" }, { name: "Сувлакі", cat: "meat" },
      { name: "Гірос", cat: "meat" }, { name: "Дзадзикі", cat: "salad" }, { name: "Шніцель", cat: "meat" },
      { name: "Сосиски Братвурст", cat: "meat" }, { name: "Брецель", cat: "pastry" }, { name: "Шварцвальдський торт", cat: "dessert" },
      { name: "Фондю", cat: "dessert" }, { name: "Раклет", cat: "meat" }, { name: "Гуляш", cat: "soup" },
      { name: "Лобстер", cat: "meat" }, { name: "Устриці", cat: "salad" }, { name: "Мідії у вині", cat: "meat" },
      { name: "Креветки на грилі", cat: "meat" }, { name: "Стейк із лосося", cat: "meat" }, { name: "Карпаччо", cat: "salad" },
      { name: "Тартар", cat: "salad" }, { name: "Салат Цезар", cat: "salad" }, { name: "Салат Олів'є", cat: "salad" },
      { name: "Вінегрет", cat: "salad" }, { name: "Окрошка", cat: "soup" }, { name: "Пельмені", cat: "meat" },
      { name: "Чебуреки", cat: "pastry" }, { name: "Біляші", cat: "pastry" }, { name: "Самса", cat: "pastry" },
      { name: "Манти", cat: "meat" }, { name: "Кус-кус", cat: "soup" }, { name: "Тажин", cat: "meat" },
      { name: "Каррі з куркою", cat: "meat" }, { name: "Тікка Масала", cat: "meat" }, { name: "Наан", cat: "pastry" },
      { name: "Самоса", cat: "pastry" }, { name: "Путін", cat: "pastry" }, { name: "Клем-чаудер", cat: "soup" },
      { name: "Маффіни", cat: "dessert" }, { name: "Донати", cat: "dessert" }, { name: "Чизкейк", cat: "dessert" },
      { name: "Морозиво", cat: "dessert" }
    ];

    const emojisList = ["🍲", "🥟", "🥬", "🥔", "🥓", "🥞", "🍗", "🥞", "🍲", "🥩", "🍕", "🍝", "🥘", "🍚", "🍰", "🥟", "🍝", "🍣", "🍱", "🍱", "🍜", "🍜", "🍲", "🍝", "🦆", "🍜", "🧀", "🥟", "🍢", "🍛", "🌯", "🥙", "🧆", "🥣", "🍔", "🍔", "🌭", "🥩", "🍟", "🍗", "🍗", "🥞", "🍫", "🥐", "🥖", "🍆", "🍲", "🥖", "🍡", "🥘", "🌮", "🍅", "🥨", "🌮", "🌯", "🌮", "🧀", "🥑", "🌯", "🌶️", "🍆", "🥗", "🍢", "🥙", "🥣", "🥩", "🌭", "🥨", "🍰", "🧀", "🧀", "🍲", "🦞", "🦪", "🐚", "🦐", "🐟", "🥩", "🥩", "🥗", "🥗", "🥗", "🥣", "🥟", "🥟", "🥟", "🥟", "🥟", "🍚", "🥘", "🍛", "🍛", "🫓", "🥟", "🍟", "🥣", "🧁", "🍩", "🍰", "🍦"];

    // Збираємо повний масив об'єктів
    const dishesList = allNames.map((item, idx) => {
      const name = item.name;
      if (customDatabase[name]) {
        return { name, emoji: emojisList[idx % emojisList.length], ...customDatabase[name] };
      }
      const t = templates[item.cat];
      return {
        name: name,
        emoji: emojisList[idx % emojisList.length],
        time: t.time,
        diff: t.diff,
        desc: `Класичний покроковий рецепт приготування страви «${name}» в домашніх умовах.`,
        ing: t.getIng(name),
        inst: t.getInst(name)
      };
    });

    function renderDishes(list) {
      const grid = document.getElementById("dishesGrid");
      if (list.length === 0) {
        grid.innerHTML = `<div class="col-span-full text-center py-20 text-stone-500 text-xl">Нічого не знайдено 😕</div>`;
        return;
      }
      grid.innerHTML = list.map(dish => `
        <button onclick="openRecipe('${dish.name}')" class="group flex flex-col items-center justify-center p-6 bg-white rounded-2xl shadow-sm border border-orange-100 hover:shadow-xl hover:border-orange-300 transition transform hover:-translate-y-1">
          <span class="text-6xl mb-3 group-hover:scale-110 transition">${dish.emoji}</span>
          <span class="font-semibold text-stone-700 text-base text-center group-hover:text-orange-600 transition">${dish.name}</span>
        </button>
      `).join('');
    }

    function filterDishes() {
      const query = document.getElementById("searchInput").value.toLowerCase();
      const filtered = dishesList.filter(d => d.name.toLowerCase().includes(query));
      renderDishes(filtered);
    }

    function openRecipe(dishName) {
      const recipe = dishesList.find(d => d.name === dishName);
      if (!recipe) return;

      const modal = document.getElementById("recipeModal");
      const title = document.getElementById("modalTitle");
      const content = document.getElementById("modalContent");

      title.innerHTML = `${recipe.emoji} ${recipe.name}`;
      content.innerHTML = `
        <p class="text-stone-600 text-lg italic border-l-4 border-orange-400 pl-4 py-1 bg-orange-50/50 rounded-r-xl">${recipe.desc}</p>
        <div class="flex flex-wrap gap-3 font-medium">
          <span class="bg-orange-100 text-orange-800 px-4 py-1.5 rounded-full text-sm">⏱ ${recipe.time}</span>
          <span class="bg-red-100 text-red-800 px-4 py-1.5 rounded-full text-sm">🔥 Складність: ${recipe.diff}</span>
        </div>
        <div class="grid md:grid-cols-3 gap-6 mt-4">
          <div class="md:col-span-1 bg-stone-50 p-5 rounded-2xl border border-stone-100 h-fit">
            <h3 class="font-bold text-lg text-stone-800 mb-3 flex items-center gap-2">🛒 Інгредієнти</h3>
            <ul class="space-y-2 text-stone-700 text-sm">
              ${recipe.ing.map(i => `<li class="flex items-start gap-2"><span class="text-orange-500 font-bold">•</span><span>${i}</span></li>`).join('')}
            </ul>
          </div>
          <div class="md:col-span-2 space-y-4">
            <h3 class="font-bold text-xl text-stone-800 flex items-center gap-2">👨‍🍳 Приготування</h3>
            <div class="space-y-3">
              ${recipe.inst.map((step, idx) => `
                <div class="flex gap-3 bg-stone-50/70 p-3.5 rounded-xl border border-stone-100">
                  <span class="flex-shrink-0 w-7 h-7 bg-orange-500 text-white rounded-full flex items-center justify-center font-bold text-sm">${idx + 1}</span>
                  <p class="text-stone-700 text-sm leading-relaxed pt-0.5">${step}</p>
                </div>
              `).join('')}
            </div>
          </div>
        </div>
      `;
      modal.classList.remove("hidden");
      modal.classList.add("flex");
    }

    function closeModal() {
      const modal = document.getElementById("recipeModal");
      modal.classList.remove("flex");
      modal.classList.add("hidden");
    }

    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeModal();
    });

    renderDishes(dishesList);
  </script>
</body>
</html>
